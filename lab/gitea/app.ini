[server]
APP_DATA_PATH = /var/lib/gitea/data
DOMAIN = __HOSTNAME__
SSH_DOMAIN = __HOSTNAME__
HTTP_PORT = 3000
ROOT_URL = http://__HOSTNAME__:3000/
DISABLE_SSH = false
START_SSH_SERVER = true
SSH_PORT = 2224
SSH_LISTEN_PORT = 2224
BUILTIN_SSH_SERVER_USER = git
LFS_START_SERVER = false

[database]
DB_TYPE = sqlite3
PATH = /var/lib/gitea/data/gitea.db

[repository]
ROOT = /var/lib/gitea/data/gitea-repositories

[security]
INSTALL_LOCK = true
SECRET_KEY = terrapin_lab_secret_key
INTERNAL_TOKEN = terrapin_lab_internal_token

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = true

[log]
MODE = console
LEVEL = Info
