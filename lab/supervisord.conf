[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:openssh]
command=/usr/sbin/sshd -D -e
priority=10
autorestart=true
stdout_logfile=/var/log/supervisor/openssh.log
stderr_logfile=/var/log/supervisor/openssh.err.log

[program:dropbear]
command=/usr/sbin/dropbear -F -E -p 2222 -r /etc/dropbear/dropbear_ed25519_host_key -r /etc/dropbear/dropbear_ecdsa_host_key -r /etc/dropbear/dropbear_rsa_host_key
priority=10
autorestart=true
stdout_logfile=/var/log/supervisor/dropbear.log
stderr_logfile=/var/log/supervisor/dropbear.err.log

[program:russh]
command=/usr/local/bin/russh-server --listen 0.0.0.0:2223
priority=10
autorestart=true
stdout_logfile=/var/log/supervisor/russh.log
stderr_logfile=/var/log/supervisor/russh.err.log

[program:gitea]
command=/usr/local/bin/gitea web --config /etc/gitea/app.ini
directory=/var/lib/gitea
user=git
priority=20
autorestart=true
environment=HOME="/home/git",USER="git",GITEA_WORK_DIR="/var/lib/gitea"
stdout_logfile=/var/log/supervisor/gitea.log
stderr_logfile=/var/log/supervisor/gitea.err.log

[program:gitea-seed]
command=/usr/local/bin/gitea-seed.sh
priority=30
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/var/log/supervisor/gitea-seed.log
stderr_logfile=/var/log/supervisor/gitea-seed.err.log
